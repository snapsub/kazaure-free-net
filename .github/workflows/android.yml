name: Build Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create Android Template Files
        run: flutter create . --project-name=kazaure_free_net --platforms=android --org com.kazaure.freenet

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build_log.txt
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "===== BUILD ERRORS ====="
            grep -n -i -E -A 5 -B 3 "what went wrong|failure:|error:|exception|failed" build_log.txt | tail -100
            exit "$result"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
